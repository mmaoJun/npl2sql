# Prompt Template v1
# 版本说明: 初始版本，包含系统指令、重试反馈、分类关键词和 few-shot 示例

version: "v1"
description: "初始提示词版本"

# ========== 系统指令 ==========
system_prompt: |
  你是一个SQL专家。根据提供的数据库表结构，将用户的自然语言问题转换为SQL查询语句。

  规则：
  1. 只生成SELECT语句，禁止INSERT/UPDATE/DELETE/DROP/ALTER
  2. 使用标准SQL语法，数据库类型为: {dialect}
  3. 只使用提供的表结构中的表和字段
  4. 如果无法生成SQL，回复"无法理解该查询"
  5. 只输出SQL语句，不要解释，不要输出markdown标记

# ========== 重试反馈模板 ==========
retry_feedback: |
  之前生成的SQL有误:
  SQL: {previousSql}
  错误: {errorMessage}
  请修正上述SQL。注意: {errorMessage}

# ========== 分类关键词 ==========
# 按优先级排列，匹配到即返回
keywords:
  SUBQUERY:
    - 超过平均
    - 高于平均
    - 低于平均
    - 比平均
    - 最贵
    - 最便宜
  TOP_N:
    - 前几
    - 前10
    - 前5
    - 前3
    - top
    - 排名
    - 最多
    - 最高
    - 最低
    - 最大
    - 最小
  TREND:
    - 趋势
    - 每月
    - 每天
    - 每年
    - 变化
    - 增长
    - 按月
    - 按天
    - 按年
    - 时间线
  AGGREGATION:
    - 统计
    - 数量
    - 总数
    - 平均
    - 最大
    - 最小
    - 汇总
    - 占比
    - 多少
    - 合计
    - 总和
  FUZZY:
    - 包含
    - 类似
    - 大约
    - 大概
    - 像
    - 模糊
    - 含有
    - 带有
  JOIN:
    - 的订单
    - 的用户
    - 关联
    - 对应
    - 所属
    - 购买
    - 下单
  WHERE_FILTER:
    - 大于
    - 小于
    - 等于
    - 不等于
    - 超过
    - 不足
    - 在
    - 之间
    - 或者
    - 并且

# ========== Few-shot 示例 ==========
examples:
  SIMPLE_SELECT:
    - question: 查询所有用户
      sql: "SELECT * FROM users"
    - question: 查询所有商品名称和价格
      sql: "SELECT name, price FROM products"

  WHERE_FILTER:
    - question: 查询年龄大于25岁的用户
      sql: "SELECT * FROM users WHERE age > 25"
    - question: 查询状态为已完成的订单
      sql: "SELECT * FROM orders WHERE status = '已完成'"

  AGGREGATION:
    - question: 统计每个部门的用户数量
      sql: "SELECT dept_id, COUNT(*) AS user_count FROM users GROUP BY dept_id ORDER BY user_count DESC"
    - question: 查询所有商品的平均价格
      sql: "SELECT AVG(price) AS avg_price FROM products"
    - question: 统计每种状态订单的数量
      sql: "SELECT status, COUNT(*) AS cnt FROM orders GROUP BY status ORDER BY cnt DESC"

  TOP_N:
    - question: 查询订单金额最高的前10个用户
      sql: "SELECT u.name, SUM(o.amount) AS total_amount FROM users u JOIN orders o ON u.id = o.user_id GROUP BY u.id ORDER BY total_amount DESC LIMIT 10"
    - question: 查询价格最高的5个商品
      sql: "SELECT name, price FROM products ORDER BY price DESC LIMIT 5"

  TREND:
    - question: 统计每月的订单数量趋势
      sql: "SELECT DATE_FORMAT(created_at, '%Y-%m') AS month, COUNT(*) AS order_count FROM orders GROUP BY month ORDER BY month"
    - question: 查询每天的销售额变化
      sql: "SELECT DATE(created_at) AS day, SUM(amount) AS daily_sales FROM orders GROUP BY day ORDER BY day"

  JOIN:
    - question: 查询用户张三的所有订单
      sql: "SELECT o.* FROM orders o JOIN users u ON o.user_id = u.id WHERE u.name = '张三'"
    - question: 查询每个用户购买的商品数量
      sql: "SELECT u.name, COUNT(oi.id) AS item_count FROM users u JOIN orders o ON u.id = o.user_id JOIN order_items oi ON o.id = oi.order_id GROUP BY u.id"

  SUBQUERY:
    - question: 查询订单金额超过平均金额的用户
      sql: "SELECT u.name FROM users u JOIN orders o ON u.id = o.user_id GROUP BY u.id HAVING SUM(o.amount) > (SELECT AVG(amount) FROM orders)"
    - question: 查询年龄最大的用户
      sql: "SELECT * FROM users WHERE age = (SELECT MAX(age) FROM users)"

  FUZZY:
    - question: 查询名字包含'张'的用户
      sql: "SELECT * FROM users WHERE name LIKE '%张%'"
    - question: 查询商品名类似'手机'的商品
      sql: "SELECT * FROM products WHERE name LIKE '%手机%'"

# ========== 方言专属示例覆盖 ==========
# 未列出的查询类型回退使用上方通用示例
dialect_overrides:
  postgresql:
    TREND:
      - question: 统计每月的订单数量趋势
        sql: "SELECT to_char(created_at, 'YYYY-MM') AS month, COUNT(*) AS order_count FROM orders GROUP BY month ORDER BY month"
      - question: 查询每天的销售额变化
        sql: "SELECT created_at::date AS day, SUM(amount) AS daily_sales FROM orders GROUP BY day ORDER BY day"
