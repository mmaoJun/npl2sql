server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: nlp2sql-backend

  # MySQL - 后端元数据库
  datasource:
    url: jdbc:mysql://localhost:3306/nlp2sql_meta?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "050407"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password: 050407
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # Spring AI - 模型配置
  # 默认使用 Ollama 本地模型, 切换为 DashScope (通义千问云端) 请修改 profiles.active 并设置 DASHSCOPE_API_KEY
  profiles:
    active: dashscope

  ai:
    # DashScope (阿里云百炼 / 通义千问) - 激活 profile: dashscope
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      chat:
        options:
          model: ${nlp2sql.model.dashscope-model}
          temperature: 0

    # Ollama (本地模型) - 激活 profile: ollama
    ollama:
      base-url: http://localhost:11434
      chat:
        options:
          model: ${nlp2sql.model.ollama-model}
          temperature: 0
          num-ctx: 4096

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nlp2sql.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: nlp2sql-jwt-secret-key-2024-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24小时

# 模型选择配置（模型名统一在此处管理，spring.ai.* 通过属性引用读取）
nlp2sql:
  model:
    provider: dashscope                    # dashscope | ollama
    dashscope-model: qwen-plus            # DashScope 模型: qwen-plus, qwen-turbo, qwen-max, qwen2.5-coder-plus 等
    ollama-model: qwen2.5-coder:7b      # Ollama 模型

# SQL 安全配置
sql-security:
  max-limit: 100
  query-timeout-seconds: 10
  max-retry: 2

# 提示词模板配置
prompt:
  version: v1  # 对应 resources/prompts/ 目录下的 yml 文件名，如 v1.yml、v2.yml

# Schema 缓存配置
schema-cache:
  ttl-seconds: 3600

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志
logging:
  level:
    com.nlp2sql: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
