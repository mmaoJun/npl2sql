server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: nlp2sql-backend

  # MySQL - 后端元数据库
  datasource:
    url: jdbc:mysql://localhost:3306/nlp2sql_meta?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: "050407"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# MyBatis-Plus
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.nlp2sql.model
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置
jwt:
  secret: nlp2sql-jwt-secret-key-2024-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24小时

# Ollama 模型配置
ollama:
  base-url: http://localhost:11434
  model: qwen2.5-coder:7b
  temperature: 0
  num-ctx: 4096
  timeout: 60

# SQL 安全配置
sql-security:
  max-limit: 100
  query-timeout-seconds: 10
  max-retry: 2

# Schema 缓存配置
schema-cache:
  ttl-seconds: 3600

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 日志
logging:
  level:
    com.nlp2sql: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
